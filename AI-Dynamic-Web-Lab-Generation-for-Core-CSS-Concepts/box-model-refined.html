<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprehensive Box Model Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }

        /* 
           Using CSS Variables to dynamically control Box 1 via JS.
           Initial values are set here.
        */
        :root {
            --disp: block;
            --w: 120;
            --rad: 0;
            
            --mt: 20; --mr: 20; --mb: 20; --ml: 20;
            --pt: 20; --pr: 20; --pb: 20; --pl: 20;
            --bt: 10; --br: 10; --bb: 10; --bl: 10;
        }

        #box1 {
            position: relative; /* Required for the absolute ::before pseudo-element */
            display: var(--disp);
            width: calc(var(--w) * 1px);
            border-radius: calc(var(--rad) * 1px);
            
            /* Apply individual values */
            margin: calc(var(--mt) * 1px) calc(var(--mr) * 1px) calc(var(--mb) * 1px) calc(var(--ml) * 1px);
            padding: calc(var(--pt) * 1px) calc(var(--pr) * 1px) calc(var(--pb) * 1px) calc(var(--pl) * 1px);
            border-width: calc(var(--bt) * 1px) calc(var(--br) * 1px) calc(var(--bb) * 1px) calc(var(--bl) * 1px);
            
            border-style: solid;
            border-color: #fde047; /* Yellow for border */
            
            /* Differentiate Content and Padding */
            background-image: linear-gradient(#93c5fd, #93c5fd), linear-gradient(#bbf7d0, #bbf7d0);
            background-clip: content-box, padding-box;
            box-sizing: content-box;
            
            /* Aesthetics */
            font-weight: bold;
            color: #1e3a8a;
            text-align: center;
            /* Using a min-height ensures content box is visible even without much text */
            min-height: 40px; 
            line-height: 40px;
            z-index: 10;
            transition: all 0.1s ease-out;
        }

        /* 
           The pseudo-element creates a visual overlay for the margin area.
           It offsets outward by the margin + border width.
        */
        #box1::before {
            content: "";
            position: absolute;
            /* Calculate offset to cover margin area: push out by margin + border */
            top: calc(-1px * (var(--mt) + var(--bt)));
            right: calc(-1px * (var(--mr) + var(--br)));
            bottom: calc(-1px * (var(--mb) + var(--bb)));
            left: calc(-1px * (var(--ml) + var(--bl)));
            
            background-color: rgba(253, 186, 116, 0.4); /* Semi-transparent orange */
            z-index: -1;
            /* Approximate outer radius */
            border-radius: calc(var(--rad) * 1px);
            pointer-events: none;
            border: 1px dashed #ea580c; /* Distinct edge for margin boundary */
            transition: all 0.1s ease-out;
        }

        #box2 {
            display: inline-block;
            background-color: #e5e7eb;
            padding: 20px;
            border: 2px solid #9ca3af;
            font-weight: 600;
            color: #374151;
            border-radius: 8px;
            transition: all 0.1s ease;
        }

        /* Custom scrollbar for controls */
        .controls-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .controls-scroll::-webkit-scrollbar-track {
            background: #f3f4f6;
            border-radius: 4px;
        }
        .controls-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e2e8f0;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]:focus::-webkit-slider-runnable-track {
            background: #cbd5e1;
        }
    </style>
</head>
<body class="h-screen overflow-hidden text-gray-800 p-2 sm:p-4">

    <div class="max-w-screen-2xl mx-auto flex flex-col lg:flex-row gap-4 h-full">
        
        <!-- Controls Column (Sidebar) -->
        <div class="w-full lg:w-80 xl:w-96 bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col overflow-hidden shrink-0">
            <div class="p-4 border-b border-gray-200 bg-gray-50">
                <h1 class="text-xl font-bold text-gray-900">Box Model</h1>
                <p class="text-xs text-gray-500 mt-1">Adjust individual side properties</p>
            </div>

            <!-- Scrollable Controls Area -->
            <div class="flex-1 overflow-y-auto p-4 controls-scroll space-y-6">
                
                <!-- General Controls -->
                <div class="space-y-3">
                    <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider">General</h2>
                    
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-gray-600">Display</label>
                        <select id="ctrl-disp" class="block w-full p-1.5 text-sm border border-gray-300 rounded-md bg-gray-50 focus:ring-blue-500 focus:border-blue-500">
                            <option value="block" selected>block</option>
                            <option value="inline-block">inline-block</option>
                            <option value="inline">inline</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-xs font-semibold text-gray-600">Width</label>
                            <span id="val-w" class="text-xs font-mono bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded">120px</span>
                        </div>
                        <input type="range" id="ctrl-w" min="0" max="400" value="120">
                    </div>

                    <div class="flex flex-col gap-1">
                        <div class="flex justify-between items-center">
                            <label class="text-xs font-semibold text-gray-600">Border Radius</label>
                            <span id="val-rad" class="text-xs font-mono bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded">0px</span>
                        </div>
                        <input type="range" id="ctrl-rad" min="0" max="100" value="0">
                    </div>
                </div>

                <!-- Padding Controls -->
                <div class="space-y-3 pt-4 border-t border-gray-100">
                    <h2 class="text-sm font-bold text-green-700 uppercase tracking-wider">Padding</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Top</label>
                                <span id="val-pt" class="text-xs font-mono bg-green-50 text-green-700 px-1 rounded">20px</span>
                            </div>
                            <input type="range" id="ctrl-pt" min="0" max="100" value="20">
                        </div>
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Right</label>
                                <span id="val-pr" class="text-xs font-mono bg-green-50 text-green-700 px-1 rounded">20px</span>
                            </div>
                            <input type="range" id="ctrl-pr" min="0" max="100" value="20">
                        </div>
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Bottom</label>
                                <span id="val-pb" class="text-xs font-mono bg-green-50 text-green-700 px-1 rounded">20px</span>
                            </div>
                            <input type="range" id="ctrl-pb" min="0" max="100" value="20">
                        </div>
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Left</label>
                                <span id="val-pl" class="text-xs font-mono bg-green-50 text-green-700 px-1 rounded">20px</span>
                            </div>
                            <input type="range" id="ctrl-pl" min="0" max="100" value="20">
                        </div>
                    </div>
                </div>

                <!-- Border Controls -->
                <div class="space-y-3 pt-4 border-t border-gray-100">
                    <h2 class="text-sm font-bold text-yellow-600 uppercase tracking-wider">Border Width</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Top</label>
                                <span id="val-bt" class="text-xs font-mono bg-yellow-50 text-yellow-700 px-1 rounded">10px</span>
                            </div>
                            <input type="range" id="ctrl-bt" min="0" max="50" value="10">
                        </div>
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Right</label>
                                <span id="val-br" class="text-xs font-mono bg-yellow-50 text-yellow-700 px-1 rounded">10px</span>
                            </div>
                            <input type="range" id="ctrl-br" min="0" max="50" value="10">
                        </div>
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Bottom</label>
                                <span id="val-bb" class="text-xs font-mono bg-yellow-50 text-yellow-700 px-1 rounded">10px</span>
                            </div>
                            <input type="range" id="ctrl-bb" min="0" max="50" value="10">
                        </div>
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Left</label>
                                <span id="val-bl" class="text-xs font-mono bg-yellow-50 text-yellow-700 px-1 rounded">10px</span>
                            </div>
                            <input type="range" id="ctrl-bl" min="0" max="50" value="10">
                        </div>
                    </div>
                </div>

                <!-- Margin Controls -->
                <div class="space-y-3 pt-4 border-t border-gray-100 pb-4">
                    <h2 class="text-sm font-bold text-orange-600 uppercase tracking-wider">Margin</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Top</label>
                                <span id="val-mt" class="text-xs font-mono bg-orange-50 text-orange-700 px-1 rounded">20px</span>
                            </div>
                            <input type="range" id="ctrl-mt" min="0" max="100" value="20">
                        </div>
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Right</label>
                                <span id="val-mr" class="text-xs font-mono bg-orange-50 text-orange-700 px-1 rounded">20px</span>
                            </div>
                            <input type="range" id="ctrl-mr" min="0" max="100" value="20">
                        </div>
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Bottom</label>
                                <span id="val-mb" class="text-xs font-mono bg-orange-50 text-orange-700 px-1 rounded">20px</span>
                            </div>
                            <input type="range" id="ctrl-mb" min="0" max="100" value="20">
                        </div>
                        <div class="flex flex-col gap-1">
                            <div class="flex justify-between items-center">
                                <label class="text-xs text-gray-600">Left</label>
                                <span id="val-ml" class="text-xs font-mono bg-orange-50 text-orange-700 px-1 rounded">20px</span>
                            </div>
                            <input type="range" id="ctrl-ml" min="0" max="100" value="20">
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Visualization Column -->
        <div class="flex-1 bg-white rounded-xl shadow-lg border border-gray-200 flex flex-col overflow-hidden relative">
            
            <!-- Header & Legend -->
            <div class="p-4 border-b border-gray-100 bg-white z-20 shadow-sm flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center">
                <h2 class="font-semibold text-gray-700 hidden sm:block">Canvas Area</h2>
                <div class="flex flex-wrap gap-3">
                    <div class="flex items-center gap-1.5">
                        <div class="w-3.5 h-3.5 rounded-sm bg-blue-300"></div>
                        <span class="text-xs font-medium text-gray-600">Content</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <div class="w-3.5 h-3.5 rounded-sm bg-green-200"></div>
                        <span class="text-xs font-medium text-gray-600">Padding</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <div class="w-3.5 h-3.5 rounded-sm bg-yellow-300 border border-yellow-400"></div>
                        <span class="text-xs font-medium text-gray-600">Border</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <div class="w-3.5 h-3.5 rounded-sm bg-orange-300 opacity-60 border border-orange-500 border-dashed"></div>
                        <span class="text-xs font-medium text-gray-600">Margin</span>
                    </div>
                </div>
            </div>

            <!-- Interactive Area -->
            <!-- A checkered background helps visualize transparencies and spacing better -->
            <div class="flex-1 overflow-auto p-8 relative" style="background-color: #fdfdfd; background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 20px 20px;">
                
                <div class="relative max-w-full">
                    <!-- Interactive Box -->
                    <div id="box1">Box 1</div>
                    
                    <!-- Static Reference Box -->
                    <div id="box2">Box 2 (Static)</div>
                </div>
                
            </div>
            
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Map configuration: defines mapping between DOM elements, their suffix, and CSS var name
            const controlsMap = [
                { id: 'ctrl-disp', valId: null, varName: '--disp', isPixel: false },
                { id: 'ctrl-w', valId: 'val-w', varName: '--w', isPixel: true },
                { id: 'ctrl-rad', valId: 'val-rad', varName: '--rad', isPixel: true },
                
                // Paddings
                { id: 'ctrl-pt', valId: 'val-pt', varName: '--pt', isPixel: true },
                { id: 'ctrl-pr', valId: 'val-pr', varName: '--pr', isPixel: true },
                { id: 'ctrl-pb', valId: 'val-pb', varName: '--pb', isPixel: true },
                { id: 'ctrl-pl', valId: 'val-pl', varName: '--pl', isPixel: true },
                
                // Borders
                { id: 'ctrl-bt', valId: 'val-bt', varName: '--bt', isPixel: true },
                { id: 'ctrl-br', valId: 'val-br', varName: '--br', isPixel: true },
                { id: 'ctrl-bb', valId: 'val-bb', varName: '--bb', isPixel: true },
                { id: 'ctrl-bl', valId: 'val-bl', varName: '--bl', isPixel: true },
                
                // Margins
                { id: 'ctrl-mt', valId: 'val-mt', varName: '--mt', isPixel: true },
                { id: 'ctrl-mr', valId: 'val-mr', varName: '--mr', isPixel: true },
                { id: 'ctrl-mb', valId: 'val-mb', varName: '--mb', isPixel: true },
                { id: 'ctrl-ml', valId: 'val-ml', varName: '--ml', isPixel: true }
            ];

            const rootElement = document.documentElement;

            // Handle updates dynamically
            const handleUpdate = (config, value) => {
                // Update CSS Variable
                rootElement.style.setProperty(config.varName, value);
                
                // Update corresponding label if it exists
                if (config.valId) {
                    const labelEl = document.getElementById(config.valId);
                    labelEl.textContent = config.isPixel ? `${value}px` : value;
                }
            };

            // Attach listeners to all inputs
            controlsMap.forEach(config => {
                const el = document.getElementById(config.id);
                
                if (el.tagName === 'SELECT') {
                    el.addEventListener('change', (e) => handleUpdate(config, e.target.value));
                } else {
                    // Range slider
                    el.addEventListener('input', (e) => handleUpdate(config, e.target.value));
                }
                
                // Initialize values on load to ensure sync
                handleUpdate(config, el.value);
            });

        });
    </script>
</body>
</html>
