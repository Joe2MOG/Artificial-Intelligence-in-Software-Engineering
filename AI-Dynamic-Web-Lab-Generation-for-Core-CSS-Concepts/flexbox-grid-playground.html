<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox & Grid Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* slate-50 */
        }
        
        /* Custom scrollbar for control panel */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        /* Playground Container Transitions */
        #playground-container {
            transition: all 0.3s ease;
        }
        
        /* Base styles for playground items to ensure visibility during layout changes */
        .pg-item {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 80px;
            min-height: 80px;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            transition: all 0.3s ease;
            text-shadow: 0px 1px 2px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col md:flex-row overflow-hidden text-slate-800">

    <!-- Control Panel -->
    <aside class="w-full md:w-80 lg:w-96 bg-white h-auto md:h-full border-r border-slate-200 shadow-xl flex flex-col z-10 overflow-y-auto shrink-0 transition-all duration-300">
        <div class="p-6 border-b border-slate-100 bg-slate-50 sticky top-0 z-20">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-purple-600">CSS Layout Lab</h1>
            <p class="text-sm text-slate-500 mt-1">Experiment with Flexbox & Grid</p>
        </div>

        <div class="p-6 space-y-6 flex-1">
            
            <!-- Global Display Property -->
            <div class="form-group">
                <label for="display" class="block text-sm font-semibold text-slate-700 mb-2">display</label>
                <div class="relative">
                    <select id="display" class="block w-full appearance-none bg-slate-50 border border-slate-300 text-slate-700 py-3 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-colors shadow-sm">
                        <option value="block">block (Default)</option>
                        <option value="flex" selected>flex</option>
                        <option value="grid">grid</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                        <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                    </div>
                </div>
            </div>

            <div class="w-full h-px bg-slate-200 my-4"></div>

            <!-- Flexbox Specific Controls -->
            <div id="flex-controls" class="space-y-6 transition-opacity duration-300">
                <h3 class="text-xs uppercase tracking-wider font-bold text-indigo-500">Flexbox Properties</h3>
                
                <div class="form-group">
                    <label for="flex-direction" class="block text-sm font-semibold text-slate-700 mb-2">flex-direction</label>
                    <div class="relative">
                        <select id="flex-direction" class="block w-full appearance-none bg-white border border-slate-300 text-slate-700 py-2 px-3 pr-8 rounded-lg leading-tight focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 shadow-sm transition-colors">
                            <option value="row" selected>row</option>
                            <option value="row-reverse">row-reverse</option>
                            <option value="column">column</option>
                            <option value="column-reverse">column-reverse</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="justify-content" class="block text-sm font-semibold text-slate-700 mb-2">justify-content</label>
                    <div class="relative">
                        <select id="justify-content" class="block w-full appearance-none bg-white border border-slate-300 text-slate-700 py-2 px-3 pr-8 rounded-lg leading-tight focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 shadow-sm transition-colors">
                            <option value="flex-start" selected>flex-start</option>
                            <option value="flex-end">flex-end</option>
                            <option value="center">center</option>
                            <option value="space-between">space-between</option>
                            <option value="space-around">space-around</option>
                            <option value="space-evenly">space-evenly</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="align-items" class="block text-sm font-semibold text-slate-700 mb-2">align-items</label>
                    <div class="relative">
                        <select id="align-items" class="block w-full appearance-none bg-white border border-slate-300 text-slate-700 py-2 px-3 pr-8 rounded-lg leading-tight focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 shadow-sm transition-colors">
                            <option value="flex-start">flex-start</option>
                            <option value="flex-end">flex-end</option>
                            <option value="center" selected>center</option>
                            <option value="stretch">stretch</option>
                            <option value="baseline">baseline</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Grid Specific Controls -->
            <div id="grid-controls" class="space-y-6 hidden opacity-50 transition-opacity duration-300">
                <h3 class="text-xs uppercase tracking-wider font-bold text-purple-500">Grid Properties</h3>
                
                <div class="form-group">
                    <label for="grid-template-columns" class="block text-sm font-semibold text-slate-700 mb-2">grid-template-columns</label>
                    <div class="relative">
                        <select id="grid-template-columns" class="block w-full appearance-none bg-white border border-slate-300 text-slate-700 py-2 px-3 pr-8 rounded-lg leading-tight focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 shadow-sm transition-colors" disabled>
                            <option value="none" selected>none</option>
                            <option value="1fr 1fr">1fr 1fr</option>
                            <option value="1fr 1fr 1fr">1fr 1fr 1fr</option>
                            <option value="repeat(3, 1fr)">repeat(3, 1fr)</option>
                            <option value="repeat(auto-fit, minmax(100px, 1fr))">repeat(auto-fit, minmax(100px, 1fr))</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="gap" class="block text-sm font-semibold text-slate-700 mb-2">gap</label>
                    <div class="relative">
                        <select id="gap" class="block w-full appearance-none bg-white border border-slate-300 text-slate-700 py-2 px-3 pr-8 rounded-lg leading-tight focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 shadow-sm transition-colors" disabled>
                            <option value="0px">0px</option>
                            <option value="10px">10px</option>
                            <option value="20px" selected>20px</option>
                            <option value="1rem">1rem</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
                            <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </aside>

    <!-- Playground Area -->
    <main class="flex-1 overflow-auto bg-slate-200/50 p-4 md:p-8 flex flex-col">
        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg font-semibold text-slate-700 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-indigo-500"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                Output Container
            </h2>
            <div id="code-snippet" class="text-xs font-mono bg-slate-800 text-emerald-400 px-3 py-1.5 rounded-md shadow-sm border border-slate-700">
                .container { display: flex; }
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-2 md:p-6 flex-1 flex flex-col">
            <!-- The actual interactive container -->
            <div id="playground-container" class="w-full bg-slate-50 border-2 border-dashed border-slate-300 rounded-xl min-h-[500px] flex-1 relative overflow-hidden p-4">
                
                <div class="pg-item bg-gradient-to-br from-rose-400 to-rose-600">1</div>
                <div class="pg-item bg-gradient-to-br from-amber-400 to-orange-500">2</div>
                <div class="pg-item bg-gradient-to-br from-emerald-400 to-teal-500">3</div>
                <div class="pg-item bg-gradient-to-br from-blue-400 to-indigo-600">4</div>
                <div class="pg-item bg-gradient-to-br from-fuchsia-400 to-purple-600">5</div>
                
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('playground-container');
            const codeSnippet = document.getElementById('code-snippet');
            
            // UI Sections
            const flexControls = document.getElementById('flex-controls');
            const gridControls = document.getElementById('grid-controls');
            
            // Dropdowns
            const selects = {
                display: document.getElementById('display'),
                flexDirection: document.getElementById('flex-direction'),
                justifyContent: document.getElementById('justify-content'),
                alignItems: document.getElementById('align-items'),
                gridTemplateColumns: document.getElementById('grid-template-columns'),
                gap: document.getElementById('gap')
            };

            function updatePlayground() {
                const displayVal = selects.display.value;
                
                // Reset container inline styles before applying new ones
                container.style.cssText = '';
                
                // Base setup
                container.style.display = displayVal;
                
                let snippetText = `.container { display: ${displayVal}; `;

                if (displayVal === 'flex') {
                    // Enable flex controls, disable grid
                    toggleSection(flexControls, true);
                    toggleSection(gridControls, false);
                    
                    // Apply flex properties
                    container.style.flexDirection = selects.flexDirection.value;
                    container.style.justifyContent = selects.justifyContent.value;
                    container.style.alignItems = selects.alignItems.value;
                    
                    // Always add a nice gap for flex if not space-between/around
                    container.style.gap = '20px';
                    
                    snippetText += `flex-direction: ${selects.flexDirection.value}; justify-content: ${selects.justifyContent.value}; align-items: ${selects.alignItems.value}; }`;
                    
                } else if (displayVal === 'grid') {
                    // Enable grid controls, disable flex
                    toggleSection(flexControls, false);
                    toggleSection(gridControls, true);
                    
                    // Apply grid properties
                    container.style.gridTemplateColumns = selects.gridTemplateColumns.value !== 'none' ? selects.gridTemplateColumns.value : '';
                    container.style.gap = selects.gap.value;
                    
                    snippetText += `grid-template-columns: ${selects.gridTemplateColumns.value}; gap: ${selects.gap.value}; }`;
                } else {
                    // Block mode - disable both specific control sets
                    toggleSection(flexControls, false);
                    toggleSection(gridControls, false);
                    
                    // Add standard margin for block elements to look nice
                    const items = container.querySelectorAll('.pg-item');
                    items.forEach(item => item.style.marginBottom = '20px');
                    
                    snippetText += `}`;
                }

                // If not block, clean up block margins
                if (displayVal !== 'block') {
                    const items = container.querySelectorAll('.pg-item');
                    items.forEach(item => item.style.marginBottom = '0');
                }

                codeSnippet.textContent = snippetText;
            }

            function toggleSection(section, isActive) {
                const inputs = section.querySelectorAll('select');
                if (isActive) {
                    section.classList.remove('opacity-50', 'hidden');
                    section.classList.add('block');
                    inputs.forEach(input => input.disabled = false);
                } else {
                    section.classList.add('opacity-50', 'hidden');
                    section.classList.remove('block');
                    inputs.forEach(input => input.disabled = true);
                }
            }

            Object.values(selects).forEach(select => {
                select.addEventListener('change', updatePlayground);
            });

            // Initial render
            updatePlayground();
        });
    </script>
</body>
</html>
